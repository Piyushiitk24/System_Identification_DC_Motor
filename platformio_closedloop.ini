; Phase 3 closed-loop firmware build.
;
; Built with:
;   pio run -c platformio_closedloop.ini
; Uploaded with:
;   pio run -c platformio_closedloop.ini -t upload
;
; The default platformio.ini (open-loop step-response sequencer in src/) is
; untouched. Two separate .ini files keep the two firmware variants from ever
; competing for the same src_dir.

[platformio]
src_dir = src_closedloop

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 230400
upload_speed = 115200
upload_port = /dev/cu.usbmodem101
